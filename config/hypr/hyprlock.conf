# Lock screen. Triggered by Super+L, the bar's power menu, idle (hypridle)
# and before suspend. Esc / Ctrl+U clears the typed password.
# Docs: https://wiki.hypr.land/Hypr-Ecosystem/hyprlock

$font = Adwaita Sans

general {
    hide_cursor = true
}

background {
    monitor =
    path = ~/.local/state/quickshell/wallpaper   # symlink kept by Quickshell Settings
    blur_passes = 3
    brightness = 0.6
}

input-field {
    monitor =
    size = 18%, 4%
    outline_thickness = 2
    inner_color = rgba(22, 22, 24, 0.6)
    outer_color = rgba(33ccffee)
    check_color = rgba(00ff99ee)
    fail_color = rgba(f87171ee)
    font_color = rgb(228, 228, 231)
    font_family = $font
    fade_on_empty = false
    rounding = 12
    placeholder_text = Password
    fail_text = $PAMFAIL
    dots_spacing = 0.3
    position = 0, -40
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    font_size = 96
    font_family = $font
    color = rgb(228, 228, 231)
    position = 0, 220
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A %-d %B"
    font_size = 22
    font_family = $font
    color = rgb(161, 161, 170)
    position = 0, 120
    halign = center
    valign = center
}
