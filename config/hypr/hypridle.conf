# Idle handling for Hyprland, started from hyprland.lua.
# Timings match GNOME on this machine: lock + screen off at 15 min,
# suspend at 100 min on AC.
# Docs: https://wiki.hypr.land/Hypr-Ecosystem/hypridle

general {
    lock_cmd = pidof hyprlock || hyprlock                             # one instance only
    before_sleep_cmd = loginctl lock-session                          # lock before suspend
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action = "on"})' # wake the screen after resume
}

listener {
    timeout = 900                                 # 15 min
    on-timeout = loginctl lock-session
}

listener {
    timeout = 930                                                 # 15.5 min
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({action = "off"})'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}

listener {
    timeout = 6000                                # 100 min
    on-timeout = systemctl suspend
}
